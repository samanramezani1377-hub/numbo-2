<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود — نومبو ۲</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>body { font-family: Vazirmatn, Tahoma, sans-serif; }</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <form method="post" action="/login" class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm space-y-4">
    <h1 class="text-2xl font-bold text-center text-indigo-700">نومبو ۲</h1>
    <p class="text-center text-gray-500 text-sm">ورود به پنل مدیریت</p>
    {% if error %}
      <div class="bg-red-50 text-red-600 text-sm rounded-lg p-3 text-center">رمز اشتباه است</div>
    {% endif %}
    <input type="password" name="password" required placeholder="رمز پنل" class="w-full border rounded-lg px-4 py-3" autofocus>
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-medium">ورود</button>
  </form>
</body>
</html>
