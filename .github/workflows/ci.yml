name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile
        run: python -m compileall -q numbo ui run.py export.py start_ui.py

      - name: Test
        run: python -m pytest -q

      - name: Package zip
        run: |
          mkdir -p dist
          zip -r dist/numbo-2.zip . \
            -x ".git/*" ".github/*" "dist/*" "venv/*" "data/*" \
               "__pycache__/*" "*/__pycache__/*" ".pytest_cache/*" \
               "*.pyc" "numbo.log" ".env"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: numbo-2
          path: dist/numbo-2.zip

      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: |
            Ready for Linux host.
            unzip numbo-2.zip -d numbo && cd numbo && sudo bash install.sh
          files: dist/numbo-2.zip
          prerelease: true
          make_latest: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/numbo-2.zip
          generate_release_notes: true
