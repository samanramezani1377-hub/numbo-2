name: Numbo 2 Live E2E

on:
  workflow_dispatch:
    inputs:
      seed_url:
        description: "Seed URL for the live crawler"
        required: true
        default: "https://woogit.ir/"
        type: string
      live_minutes:
        description: "How long the live UI stays online"
        required: true
        default: "30"
        type: number

permissions:
  contents: read

concurrency:
  group: numbo-live-e2e
  cancel-in-progress: true

jobs:
  live-e2e:
    name: Real Numbo runtime + live UI
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run baseline tests
        run: python -m pytest -q

      - name: Compile all Python
        run: python -m compileall -q numbo ui run.py export.py start_ui.py

      - name: Verify real crawler with local fixture
        run: |
          rm -rf data live-fixture
          mkdir -p data live-fixture
          cp config.json config.live-backup.json
          python - <<'PY'
          import json
          p = "config.json"
          c = json.load(open(p))
          c["allowed_tlds"] = []
          c["cycle_delay"] = 999999
          c["panel_port"] = 8080
          json.dump(c, open(p, "w"), ensure_ascii=False, indent=2)
          PY
          cat > live-fixture/index.html <<'EOF'
          <!doctype html>
          <html><head><title>Numbo Live Fixture - WooCommerce</title></head>
          <body><h1>Numbo Live Fixture</h1><p>Phone: +98 21 1234 5678</p><p>Email: live@example.test</p><a href="/contact.html">Contact</a><a href="/about.html">About</a><script src="/wp-content/plugins/woocommerce/assets/js/frontend/cart-fragments.min.js"></script></body></html>
          EOF
          cat > live-fixture/contact.html <<'EOF'
          <!doctype html><html><body><h1>Contact</h1><p>Phone: +98 21 1234 5678</p><p>Email: contact@example.test</p></body></html>
          EOF
          cat > live-fixture/about.html <<'EOF'
          <!doctype html><html><body><h1>About</h1><p>WordPress WooCommerce shop.</p></body></html>
          EOF
          python -m http.server 8765 --directory live-fixture > fixture.log 2>&1 &
          echo $! > fixture.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          nohup python start_ui.py > ui.log 2>&1 &
          echo $! > ui.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > health.json; then break; fi
            sleep 1
          done
          test -s health.json
          curl --fail --silent -X POST http://127.0.0.1:8080/seeds --data-urlencode "seeds=http://127.0.0.1:8765/"
          curl --fail --silent -X POST http://127.0.0.1:8080/start >/dev/null
          found=0
          for i in $(seq 1 60); do
            sleep 1
            if [ -f data/numbo.db ]; then
              count=$(python - <<'PY'
          import sqlite3
          try:
              c=sqlite3.connect("data/numbo.db")
              print(c.execute("SELECT COUNT(*) FROM contacts").fetchone()[0])
              c.close()
          except Exception:
              print(0)
          PY
              )
              if [ "$count" -gt 0 ]; then found=1; break; fi
            fi
          done
          test "$found" -eq 1
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect("data/numbo.db")
          rows=c.execute("SELECT source_url, domain, phones, emails, technologies FROM contacts").fetchall()
          assert rows
          assert any("example.test" in (r[3] or "") for r in rows)
          print(f"Persisted contacts: {len(rows)}")
          c.close()
          PY
          curl --fail --silent -o live-export.xlsx http://127.0.0.1:8080/export
          test -s live-export.xlsx
          curl --fail --silent -X POST http://127.0.0.1:8080/stop >/dev/null
          curl --fail --silent http://127.0.0.1:8080/api/stats > stats-pre-live.json
          cat stats-pre-live.json
          cp config.live-backup.json config.json

      - name: Prepare live session
        run: |
          rm -rf data
          mkdir -p data
          nohup python start_ui.py > live-ui.log 2>&1 &
          echo $! > live-ui.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > live-health.json; then break; fi
            sleep 1
          done
          test -s live-health.json
          curl --fail --silent -X POST http://127.0.0.1:8080/seeds --data-urlencode "seeds=${{ inputs.seed_url }}"
          curl --fail --silent -X POST http://127.0.0.1:8080/start >/dev/null
          echo "Live seed: ${{ inputs.seed_url }}"
          echo "Live crawler started."
          curl --fail --silent http://127.0.0.1:8080/api/stats

      - name: Install and configure read-only public gateway
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo tee /etc/nginx/sites-available/numbo-live >/dev/null <<'EOF'
          server {
              listen 8081;
              server_name _;
              location / {
                  limit_except GET HEAD {
                      deny all;
                  }
                  proxy_pass http://127.0.0.1:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
              }
          }
          EOF
          sudo ln -sf /etc/nginx/sites-available/numbo-live /etc/nginx/sites-enabled/numbo-live
          sudo nginx -t
          sudo systemctl restart nginx
          curl --fail --silent http://127.0.0.1:8081/health

      - name: Start temporary public live URL
        run: |
          curl --fail --location --silent --show-error -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --url http://127.0.0.1:8081 --no-autoupdate > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid
          url=""
          for i in $(seq 1 30); do
            url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
            if [ -n "$url" ]; then break; fi
            sleep 2
          done
          test -n "$url"
          echo "$url" > live-url.txt
          {
            echo "## Numbo 2 Live E2E"
            echo
            echo "**Live UI:** $url"
            echo
            echo "**Seed:** \`${{ inputs.seed_url }}\`"
            echo
            echo "**Session:** ${{ inputs.live_minutes }} minutes"
            echo
            echo "The public gateway is intentionally **read-only** (GET/HEAD). The crawler is running on the real GitHub Actions runner."
            echo
            echo "Use Dashboard, Contacts, Logs and Stats to watch the real runtime."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "NUMBO LIVE UI: $url"

      - name: Keep real runtime online and report progress
        run: |
          duration=$(( ${{ inputs.live_minutes }} * 60 ))
          elapsed=0
          while [ "$elapsed" -lt "$duration" ]; do
            stats=$(curl --fail --silent http://127.0.0.1:8080/api/stats || echo '{"error":"stats unavailable"}')
            echo "[$(date -u '+%H:%M:%S UTC')] elapsed=\${elapsed}s stats=\${stats}"
            sleep 10
            elapsed=$((elapsed + 10))
          done

      - name: Stop live runtime and collect evidence
        if: always()
        run: |
          curl --silent --show-error -X POST http://127.0.0.1:8080/stop >/dev/null 2>&1 || true
          curl --silent --show-error http://127.0.0.1:8080/api/stats > stats-final.json 2>/dev/null || true
          echo "=== FINAL STATS ==="
          cat stats-final.json 2>/dev/null || true
          echo "=== NUMBO LOG ==="
          tail -n 200 numbo.log 2>/dev/null || true
          echo "=== LIVE UI LOG ==="
          tail -n 200 live-ui.log 2>/dev/null || true
          echo "=== CLOUDFLARED LOG ==="
          tail -n 100 cloudflared.log 2>/dev/null || true

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numbo-2-live-e2e
          path: |
            live-url.txt
            live-health.json
            stats-pre-live.json
            stats-final.json
            data/numbo.db
            live-export.xlsx
            numbo.log
            live-ui.log
            cloudflared.log
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          if [ -f cloudflared.pid ]; then kill "$(cat cloudflared.pid)" 2>/dev/null || true; fi
          if [ -f live-ui.pid ]; then kill "$(cat live-ui.pid)" 2>/dev/null || true; fi
          if [ -f ui.pid ]; then kill "$(cat ui.pid)" 2>/dev/null || true; fi
          if [ -f fixture.pid ]; then kill "$(cat fixture.pid)" 2>/dev/null || true; fi
